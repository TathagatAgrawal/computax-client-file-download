name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
      - name: Build app
        run: uv run pyinstaller --noconfirm --distpath dist --workpath build packaging/itr-fetch.spec
      - name: Package Windows exe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir release
          cp "dist/ITR Fetch.exe" release/ITR-Fetch-Windows.exe
      - name: Package macOS app (zip keeps the bundle intact)
        if: runner.os == 'macOS'
        run: |
          mkdir release
          ditto -c -k --keepParent "dist/ITR Fetch.app" release/ITR-Fetch-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" assets/* --repo "${{ github.repository }}" --title "ITR Fetch ${{ github.ref_name }}" --generate-notes
