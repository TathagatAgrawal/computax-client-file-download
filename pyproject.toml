[project]
name = "computax-client-file-download"
version = "0.1.2"
description = "ITR Fetch: copy ITR-V and Computation PDFs for a CompuTax client across years"
readme = "README.md"
authors = [
    { name = "Tathagat Agrawal", email = "tathagat.2909@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
itr-fetch = "computax_client_file_download:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "D",   # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"
